name: Build Sonix AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build Sonix debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for beta test
        run: cp app/build/outputs/apk/debug/app-debug.apk "SonixAi(Beta Test).apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonixAi-Beta-Test-apk
          path: "SonixAi(Beta Test).apk"
          if-no-files-found: error
          retention-days: 14
