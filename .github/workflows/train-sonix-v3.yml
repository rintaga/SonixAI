name: Train Sonix AI 3.0

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Pretrained base model"
        required: true
        default: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
        type: string
      max_steps:
        description: "Maximum CPU training steps"
        required: true
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate training dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate dataset
        run: |
          python training/validate_dataset.py \
            --dataset training/dataset.jsonl \
            --report dataset-report.json

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: Sonix-AI-3.0-Dataset-Report
          path: dataset-report.json
          retention-days: 30

  train:
    name: Train Sonix LoRA adapter on CPU
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/requirements.txt

      - name: Display runner information
        run: |
          python -c "import os, torch; print('CPU threads:', os.cpu_count()); print('CUDA:', torch.cuda.is_available())"

      - name: Train Sonix adapter
        env:
          MODEL_ID: ${{ inputs.model_id }}
          MAX_STEPS: ${{ inputs.max_steps }}
        run: |
          python training/train_lora.py \
            --model-id "$MODEL_ID" \
            --max-steps "$MAX_STEPS" \
            --dataset training/dataset.jsonl \
            --output-dir training/output/sonix-lora \
            --threads 4 \
            --max-length 512

      - name: Package adapter
        run: |
          cd training/output
          zip -qr sonix-ai-3.0-adapter.zip sonix-lora

      - name: Upload Sonix AI 3.0 adapter
        uses: actions/upload-artifact@v4
        with:
          name: Sonix-AI-3.0-Adapter
          path: training/output/sonix-ai-3.0-adapter.zip
          if-no-files-found: error
          retention-days: 30
